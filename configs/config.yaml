server:
  host: 0.0.0.0
  port: 8080

database:
  path: db.sqlite3
  busy-timeout: 5s
  journal-mode: WAL

storage:
  base-dir: uploads
  public-url: http://localhost:8080/media

video:
  worker-count: 2
  max-file-size: 100MB
  allowed-extensions:
    - .mp4
    - .webm
    - .mov

log:
  level: info
  format: json
